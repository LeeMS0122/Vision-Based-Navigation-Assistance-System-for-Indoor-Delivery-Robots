<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Video Demo v1</title>
  <link rel="stylesheet" href="/static/css/style.css" />
</head>
<body>
  <main class="container" style="grid-template-columns: 1.7fr 1fr;">
    <section class="left-panel">
      <h2>영상 업로드 모드 (수동 Goal)</h2>
      <form id="videoForm" class="upload-card wrap">
        <input id="videoFile" type="file" accept="video/*" required />
        <label>Sample FPS <input id="sampleFps" type="number" value="5" min="1" max="10" /></label>
        <button type="submit">분석 실행</button>
        <span id="statusText">대기 중</span>
      </form>
      <p>Goal: 파일 선택 후 아래 첫 프레임을 클릭하세요.</p>
      <div style="position:relative; display:inline-block; max-width:100%;">
        <img id="goalCanvas" style="max-width:100%; border:1px solid #ccc; display:block; min-height:180px;" />
        <div id="goalMarker" style="position:absolute; width:12px; height:12px; border-radius:50%; background:#ff3b30; border:2px solid #fff; transform:translate(-50%,-50%); display:none; pointer-events:none;"></div>
      </div>
      <video id="resultVideo" controls style="width:100%; margin-top:12px;"></video>
      <img id="resultImage" style="max-width:100%; margin-top:12px; border:1px solid #ccc;" />
    </section>
    <aside class="right-panel">
      <h3>상태</h3>
      <pre id="jsonDump"></pre>
    </aside>
  </main>
  <script src="/static/js/video_demo.js"></script>
</body>
</html>
